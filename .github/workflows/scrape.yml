name: Collect Pokemon card prices

on:
  schedule:
    - cron: "17 13 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore database from compressed copy
        run: |
          if [ -f pokemon_prices.db.gz ] && [ ! -f pokemon_prices.db ]; then
            gunzip -k pokemon_prices.db.gz
          fi
      - name: Collect prices
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: python scraper.py --db pokemon_prices.db
      - name: Export site JSON
        run: python export_json.py pokemon_prices.db price-data.json
      - name: Generate 7-day predictions
        run: python predict.py --db pokemon_prices.db --predict --json predictions.json
      - name: Compress database
        run: gzip -9 -c pokemon_prices.db > pokemon_prices.db.gz
      - name: Commit updated data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git rm --cached --ignore-unmatch --quiet pokemon_prices.db
          git add pokemon_prices.db.gz price-data.json predictions.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Price snapshot $(date -u +%Y-%m-%d)"
            # Pull first: repo may have moved while this job ran (e.g. manual uploads)
            git pull --rebase origin main
            git push
          fi
